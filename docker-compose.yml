version: '3.8'

services:
  web:
    build: .
    container_name: djanreserve-web-dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./djanreserve:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://djanreserve:your-postgres-password@db:5432/djanreserve
      - POSTGRES_DB=djanreserve
      - POSTGRES_USER=djanreserve
      - POSTGRES_PASSWORD=your-postgres-password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: djanreserve-db-dev
    env_file:
      - .env
    environment:
      - POSTGRES_DB=djanreserve
      - POSTGRES_USER=djanreserve
      - POSTGRES_PASSWORD=your-postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djanreserve -d djanreserve"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
