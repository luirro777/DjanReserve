{% extends 'base.html' %}

{% block title %}Eliminar Reserva{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h2>Confirmar Eliminación</h2>
            </div>
            <div class="card-body">
                <p>¿Está seguro de que desea eliminar la reserva "<strong>{{ object.titulo }}</strong>"?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mt-3">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                        <a href="{% url 'agenda_list' %}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
